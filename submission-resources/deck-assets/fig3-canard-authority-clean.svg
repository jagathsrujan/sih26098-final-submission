<text x="269.667" y="145" text-anchor="end" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">apogee</text>
<line x1="523.778" y1="34" x2="523.778" y2="152" style="stroke:var(--f-ink3, #7b8794);stroke-width:1;stroke-dasharray:2 3"/>
<text x="518.778" y="145" text-anchor="end" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">impact — ≈ 90 s</text>
<text x="134.333" y="145" text-anchor="start" style="font-size:9px;fill:var(--f-accent, #0b5cad);font-weight:600">guided</text>
<line x1="296" y1="60" x2="296" y2="80.4421" style="stroke:var(--f-flag, #a4551a);stroke-width:0.9;stroke-dasharray:2 2"/>
<text x="296" y="57" text-anchor="middle" style="font-size:8.5px;fill:var(--f-flag, #a4551a);font-weight:400">gate limits command</text>
<text x="46" y="196" text-anchor="start" style="font-size:8.5px;fill:var(--f-ink3, #7b8794);font-weight:400">Envelope taken from the reference flight profile.  It moves when our own aerodynamic data arrives.</text>
<text x="46" y="210" text-anchor="start" style="font-size:8.5px;fill:var(--f-ink3, #7b8794);font-weight:400">The requirement is on the worst point inside the window, not on the average.</text>
<text x="46" y="224" text-anchor="start" style="font-size:8.5px;fill:var(--f-ink3, #7b8794);font-weight:400">Derived figures; the guided-window analysis re-quantifies them.</text>
