<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 232" width="566" height="232" role="img" aria-label="Canard force and guidance authority against time" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;display:block">
<title>Canard force and guidance authority against time</title>
<desc>Available control force envelope with the guided window shaded and the gate-limited band marked.</desc>
