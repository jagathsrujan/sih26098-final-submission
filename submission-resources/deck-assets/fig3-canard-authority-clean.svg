<text x="40" y="28" text-anchor="end" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">N</text>
<line x1="46" y1="152" x2="46" y2="156" style="stroke:var(--f-rule, #d9dee4);stroke-width:1"/>
<text x="46" y="167" text-anchor="middle" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">launch</text>
<line x1="296" y1="152" x2="296" y2="156" style="stroke:var(--f-rule, #d9dee4);stroke-width:1"/>
<text x="296" y="167" text-anchor="middle" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">mid-flight</text>
<line x1="546" y1="152" x2="546" y2="156" style="stroke:var(--f-rule, #d9dee4);stroke-width:1"/>
<text x="546" y="167" text-anchor="middle" style="font-size:9px;fill:var(--f-ink3, #7b8794);font-weight:400">impact</text>
<text x="546" y="181" text-anchor="end" style="font-size:8px;fill:var(--f-ink3, #7b8794);font-weight:400">flight phase — the window opens and closes by the authority gate</text>
