<text x="339" y="372" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- out-of-line rotor</text>
<text x="339" y="387" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- setback + spin + command</text>
<text x="339" y="402" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- fireset, interlocked</text>
<text x="339" y="417" text-anchor="start" style="font-size:8px;fill:var(--f-flag, #a4551a);font-weight:400">- thresholds at hardware definition</text>
<line x1="477" y1="376" x2="484" y2="376" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="485" y="326" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
