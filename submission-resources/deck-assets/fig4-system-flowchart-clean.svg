<text x="408" y="291" text-anchor="start" style="font-size:7.5px;fill:var(--f-ink2, #46525f);font-weight:400">charges the fireset</text>
<path d="M 460 134 L 460 142 L 480 142 L 480 297 L 440 297 L 440 326" marker-end="url(#ar4)" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1;stroke-dasharray:6 4;"/>
<text x="492" y="291" text-anchor="start" style="font-size:7.5px;fill:var(--f-ink2, #46525f);font-weight:400">veto: predicted miss</text>
<rect x="8" y="446" width="644" height="54" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="20" y="460" text-anchor="start" style="font-size:9.5px;fill:var(--f-ink, #10151b);font-weight:400">Flight computer — one dual-core part</text>
<text x="20" y="474" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">Nav core — filter, bias estimator, the IPP law</text>
<text x="20" y="487" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">Control core — the 1 kHz cascade, hardware-timed sampling</text>
<text x="340" y="460" text-anchor="start" style="font-size:9.5px;fill:var(--f-ink, #10151b);font-weight:400">The shell — where the 121 kJ ends</text>
<text x="340" y="474" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">121 kJ in ≤ 90 s → heat into the shell body</text>
<text x="340" y="487" text-anchor="start" style="font-size:8px;fill:var(--f-flag, #a4551a);font-weight:400">≥58 W/K at the well — rig closes it</text>
<text x="330" y="512" text-anchor="middle" style="font-size:6.5px;fill:var(--f-ink3, #7b8794);font-weight:400">Lineage: two-pair canards + alternator as de-spin actuator — fielded M1156 specification / US 6,981,672 (2006, expired).</text>
