<text x="494" y="226" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- avionics loads</text>
<text x="494" y="241" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- drive current → ring torque</text>
<text x="494" y="256" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- ring-side electronics</text>
<text x="494" y="271" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- the design question: routing</text>
<rect x="8" y="300" width="644" height="130" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="20" y="319" text-anchor="start" style="font-size:9.5px;fill:var(--f-ink, #10151b);font-weight:400">Multi-mode fuze and safety system</text>
<rect x="20" y="326" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="93" y="346" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Sensor suite</text>
<line x1="20" y1="352" x2="166" y2="352" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="29" y="372" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- crystal timer</text>
<text x="29" y="387" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- impact, short delay, graze</text>
<text x="29" y="402" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- proximity RF, 2–15 m burst</text>
<text x="29" y="417" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- burst time re-syncs from nav</text>
<line x1="167" y1="376" x2="174" y2="376" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="175" y="326" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="248" y="346" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Central controller</text>
<line x1="175" y1="352" x2="321" y2="352" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="184" y="372" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- own MCU and reserve rail</text>
<text x="184" y="387" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- mode and arming logic</text>
<text x="184" y="402" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- two-tier BIT</text>
<text x="184" y="417" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- one-way optical link from kit</text>
