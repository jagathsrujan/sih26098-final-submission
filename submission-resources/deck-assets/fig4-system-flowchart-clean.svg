<line x1="485" y1="352" x2="631" y2="352" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="494" y="372" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- centreline initiation</text>
<text x="494" y="387" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- annular about the train bore</text>
<text x="494" y="402" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- MIL-STD-1316 · AOP-39</text>
<text x="494" y="417" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- the veto withholds it: a dud</text>
<path d="M 600 180 L 600 134" marker-end="url(#ar4)" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1;"/>
<text x="590" y="168" text-anchor="end" style="font-size:7.5px;fill:var(--f-ink2, #46525f);font-weight:400">current → ring torque</text>
<path d="M 336 134 L 336 148 L 170 148 L 170 297 L 250 297 L 250 326" marker-end="url(#ar4)" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1;stroke-dasharray:6 4;"/>
<text x="24" y="291" text-anchor="start" style="font-size:7.5px;fill:var(--f-ink2, #46525f);font-weight:400">one-way · arming-gated · optical</text>
