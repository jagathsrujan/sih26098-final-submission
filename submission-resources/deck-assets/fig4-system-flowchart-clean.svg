<rect x="485" y="34" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="558" y="54" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Canard ring · actuation</text>
<line x1="485" y1="60" x2="631" y2="60" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="494" y="80" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- four fixed canards on the ring</text>
<text x="494" y="95" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- steering pair: net force</text>
<text x="494" y="110" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- control pair: roll torque</text>
<text x="494" y="125" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- F_steer ≥ 18.1 N (derived)</text>
<rect x="8" y="154" width="644" height="130" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="20" y="173" text-anchor="start" style="font-size:9.5px;fill:var(--f-ink, #10151b);font-weight:400">Power supply system</text>
<rect x="20" y="180" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="93" y="200" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Alternator — machine</text>
<line x1="20" y1="206" x2="166" y2="206" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="29" y="226" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- magnets on ring, coils body</text>
<text x="29" y="241" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- the actuator is the generator</text>
<text x="29" y="256" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- 2.92 kW / 121 kJ sizing figures</text>
<text x="29" y="271" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- no flight battery</text>
<line x1="167" y1="230" x2="174" y2="230" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="175" y="180" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="248" y="200" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Power conditioning</text>
<line x1="175" y1="206" x2="321" y2="206" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="184" y="226" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- four-quadrant stage</text>
<text x="184" y="241" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- buck generating, boost motor</text>
<text x="184" y="256" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- 180 V bus, regulated rail</text>
<text x="184" y="271" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- high-frequency, controlled edge</text>
<line x1="322" y1="230" x2="329" y2="230" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="330" y="180" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="403" y="200" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Supercapacitor buffer</text>
<line x1="330" y1="206" x2="476" y2="206" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="339" y="226" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- chopper dump: 121 kJ → shell</text>
<text x="339" y="241" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- supercapacitor buffer</text>
<text x="339" y="256" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- fireset, hold-up, bursts</text>
<text x="339" y="271" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- surplus capacity at apogee</text>
<line x1="477" y1="230" x2="484" y2="230" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="485" y="180" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
