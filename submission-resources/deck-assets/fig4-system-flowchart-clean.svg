<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 518" width="660" height="518" role="img" aria-label="STHIRA-PGK system flowchart: flight chain, power supply system, fuze and safety system" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;display:block">
<title>STHIRA-PGK system flowchart: flight chain, power supply system, fuze and safety system</title>
<desc>Three chains, four blocks each: the flight chain, the power supply system and the fuze and safety system, with the cross-lane interfaces and the flight computer and shell below.</desc>
<defs><marker id="ar4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" style="fill:var(--f-ink, #10151b)"/></marker></defs>
<defs><marker id="ar4f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" style="fill:var(--f-flag, #a4551a)"/></marker></defs>
<rect x="8" y="8" width="644" height="130" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="20" y="27" text-anchor="start" style="font-size:9.5px;fill:var(--f-ink, #10151b);font-weight:400">Flight chain</text>
<rect x="20" y="34" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="93" y="54" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Pre-launch set-up</text>
