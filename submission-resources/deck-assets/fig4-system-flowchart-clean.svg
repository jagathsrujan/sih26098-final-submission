<text x="29" y="80" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- fuze setting on the gun line</text>
<text x="29" y="95" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- AOP-22 inductive set</text>
<text x="29" y="110" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- target + met in the package</text>
<text x="29" y="125" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- read back before loading</text>
<line x1="167" y1="84" x2="174" y2="84" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="175" y="34" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="248" y="54" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Navigation &amp; sensing</text>
<line x1="175" y1="60" x2="321" y2="60" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="184" y="80" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- GNSS on the spin axis</text>
<text x="184" y="95" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- IMU on the de-spun ring</text>
<text x="184" y="110" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- RF Doppler + ring pickoff</text>
<text x="184" y="125" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- nav 3.7 m derived against 5 m</text>
<line x1="322" y1="84" x2="329" y2="84" marker-end="url(#ar4)" style="stroke:var(--f-ink, #10151b);stroke-width:1"/>
<rect x="330" y="34" width="146" height="100" rx="3" style="fill:none;stroke:var(--f-ink, #10151b);stroke-width:1"/>
<text x="403" y="54" text-anchor="middle" style="font-size:10px;fill:var(--f-ink, #10151b);font-weight:400">Guidance &amp; control</text>
<line x1="330" y1="60" x2="476" y2="60" style="stroke:var(--f-ink3, #7b8794);stroke-width:0.8"/>
<text x="339" y="80" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- propagate to impact (IPP)</text>
<text x="339" y="95" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- bias estimator from t = 0</text>
<text x="339" y="110" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- gate is computed, not timed</text>
<text x="339" y="125" text-anchor="start" style="font-size:8px;fill:var(--f-ink2, #46525f);font-weight:400">- 1 kHz cascade, control core</text>
